name: بناء تطبيق أندرويد

# يُشغَّل يدوياً من تبويب Actions، وتلقائياً عند وسم إصدار (v1.0.0 مثلاً).
#
# ليس على كل دفعة: بناء أندرويد يستغرق دقائق ويستهلك حصّة الدقائق، ولا فائدة
# من حزمةٍ جديدة مع كل تعديل نصّي.
on:
  workflow_dispatch:
    inputs:
      appbundle:
        description: 'ابنِ حزمة Google Play أيضاً (تضاعف الزمن)'
        type: boolean
        default: false
  push:
    tags: ['v*']

# لكتابة الإصدار الذي يحمل الحزمة. وما عداه يبقى على القراءة وحدها.
permissions:
  contents: write

jobs:
  apk:
    name: حزمة APK
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      # عدّة أندرويد كاملة مثبّتة أصلاً على عامل GitHub، وهي التي يتعذّر
      # تنزيلها في بيئات مغلقة الشبكة.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.0
          channel: stable
          cache: true

      - name: تهيئة مفاتيح المشروع
        working-directory: mobile
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        # بلا أسرار يُبنى التطبيق على بياناته التجريبية فيبقى قابلاً للتصفّح.
        # والمفتاح العام وحده هنا — لا `service_role` ولا كلمة مرور القاعدة،
        # فالحزمة تُفكّ ويُستخرج ما فيها.
        run: |
          if [ -n "$SUPABASE_URL" ] && [ -n "$SUPABASE_ANON_KEY" ]; then
            printf '{\n  "SUPABASE_URL": "%s",\n  "SUPABASE_ANON_KEY": "%s"\n}\n' \
              "$SUPABASE_URL" "$SUPABASE_ANON_KEY" > env.json
            echo "المفاتيح مضبوطة — التطبيق سيتصل بقاعدتك."
            echo "### المفاتيح: مضبوطة ✅" >> "$GITHUB_STEP_SUMMARY"
            echo "التطبيق في هذه الحزمة يتصل بقاعدتك." >> "$GITHUB_STEP_SUMMARY"
          else
            echo '{}' > env.json
            echo "لا أسرار مضبوطة — التطبيق سيعمل على البيانات التجريبية."
            echo "### المفاتيح: غير مضبوطة ⚠️" >> "$GITHUB_STEP_SUMMARY"
            echo "الحزمة تعمل على **البيانات التجريبية** لا قاعدتك. لربطها: Settings ← Secrets and variables ← Actions، وأضِف \`SUPABASE_URL\` و\`SUPABASE_ANON_KEY\`، ثم أعِد التشغيل." >> "$GITHUB_STEP_SUMMARY"
          fi

      # ــــ الدفع إلى الجوال ــــــــــــــــــــــــــــــــــــــــــــــــــ
      #
      # `google-services.json` متروكٌ خارج المستودع: هو ملكُ مشروع Firebase
      # الخاص بصاحب المنصّة. وما لم يُوضع هنا فالحزمةُ الخارجة من هذا السير
      # **لا تصلها إشعاراتٌ وهي مغلقة أبداً** — مهما ضُبطت الأسرار في Supabase
      # ومهما شُغّلت ملفات SQL. وهذا ما كان يُنسى: يُوضع الملف على حاسوب
      # صاحبه فتعمل نسختُه المحلّية، ثم يُنزَّل الإصدارُ من GitHub فلا يصل شيء
      # ولا خطأ يقول لماذا.
      - name: تهيئة الدفع إلى الجوال
        working-directory: mobile
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          set -euo pipefail
          if [ -z "${GOOGLE_SERVICES_JSON:-}" ]; then
            echo "PUSH_EXPECTED=0" >> "$GITHUB_ENV"
            echo "### الدفع إلى الجوال: مطفأ ⚠️" >> "$GITHUB_STEP_SUMMARY"
            echo "الإشعارات تعمل **داخل التطبيق** وحده. لتصل الجوالَ وهو مغلق: أضِف سرَّ \`GOOGLE_SERVICES_JSON\` في Settings ← Secrets and variables ← Actions، ثم أعِد التشغيل. الخطوات في \`supabase/functions/push/README.md\`." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json

          # يُفحص هنا لا عند Gradle: محتوىً مكسور يُسقط البناء بعد دقائق
          # برسالةٍ لا تقول إن العلّة في السرّ.
          jq -e . android/app/google-services.json > /dev/null || {
            echo "::error::محتوى GOOGLE_SERVICES_JSON ليس JSON صالحاً — انسخ الملف كاملاً كما نزّلته من Firebase."
            exit 1
          }

          # واسمُ الحزمة: إضافة Google Services ترفض ملفاً لمشروعٍ آخر، ورسالتُها
          # (‏«No matching client found»‏) تُقرأ كعطبٍ في المشروع لا كخطأ في
          # الملف. وهو أكثر ما يقع: يُضاف تطبيق أندرويد باسمٍ مخترَع.
          # `any(…)` لا `.client[]? == $p`: الثانية تطبع سطراً لكل عميل، فيصير
          # حكمُ `jq -e` على آخر سطرٍ وحده — فملفٌ فيه تطبيقان أوّلُهما تطبيقُنا
          # يُرفض لأن الأخير ليس هو. والأولى تُخرج قيمةً واحدة.
          want=ye.aras.aras
          if ! jq -e --arg p "$want" \
              'any(.client[]?; .client_info.android_client_info.package_name == $p)' \
              android/app/google-services.json > /dev/null; then
            echo "::error::هذا الملف ليس لتطبيقنا: لا عميل فيه باسم الحزمة $want. أضِف تطبيق أندرويد بهذا الاسم بالضبط في Firebase ونزّل الملف من جديد."
            exit 1
          fi

          echo "PUSH_EXPECTED=1" >> "$GITHUB_ENV"
          echo "الدفع مضبوط — الحزمة ستصلها إشعاراتٌ وهي مغلقة."

      # أثقل ما في البناء البارد ليس الشيفرة بل ما يُنزَّل: توزيعة Gradle
      # ومكتبات AGP و Kotlin و AndroidX. حفظها يختصر البناء التالي إلى دقائق.
      - name: ذاكرة Gradle المؤقتة
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('mobile/android/**/*.gradle*', 'mobile/android/**/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - run: flutter pub get
        working-directory: mobile

      - run: flutter analyze
        working-directory: mobile

      - run: flutter test
        working-directory: mobile

      # حزمة لكل معمارية بدل واحدة سمينة: حزمة ARM64 وحدها أصغر بالثلثين،
      # وشبكة الجوال في اليمن تجعل الفرق ملموساً عند التنزيل.
      #
      # و**معماريّتان لا ثلاث**: `x86_64` لا يعمل عليها جوالٌ واحد — هي
      # للمحاكيات — وكانت تُبنى في كل مرّة ولا تُنشر، فتأكل من زمن البناء
      # ولا يراها أحد.
      #
      # و`--split-debug-info` يُخرج جدولَ الرموز إلى ملفّاتٍ جانبية بدل أن
      # يُشحن داخل الحزمة. وهي رموزٌ لا يقرؤها الجهاز أبداً — تُقرأ عند فكّ
      # أثر عطبٍ على حاسوب المطوّر، ولذلك تُرفع مع الحزم لا تُحذف.
      - name: بناء APK
        working-directory: mobile
        run: |
          flutter build apk --release \
            --split-per-abi \
            --target-platform android-arm,android-arm64 \
            --split-debug-info=build/symbols \
            --dart-define-from-file=env.json

      # فحص الحزمة المبنيّة لا الشيفرة التي بُنيت منها. إذنُ الإنترنت مثالُ ما
      # يوجب هذا: قالب Flutter يضعه في بياني التنقيح والتشخيص وحدهما، فيمرّ
      # التحليل والاختبار والتشغيل المحلي كلّها، ثم تخرج حزمة إصدارٍ لا تصل
      # إلى الشبكة. ولا يكشفه إلا سؤال الحزمة نفسها عمّا فيها.
      - name: فحص الحزمة نفسها
        working-directory: mobile
        run: |
          set -euo pipefail
          APK=build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          AAPT=$(ls -d "$ANDROID_HOME"/build-tools/*/aapt2 2>/dev/null | sort -V | tail -1)
          if [ -z "$AAPT" ]; then echo "::error::لم أجد aapt2"; exit 1; fi

          "$AAPT" dump permissions "$APK" | tee /tmp/perms.txt
          grep -q 'android.permission.INTERNET' /tmp/perms.txt || {
            echo "::error::الحزمة بلا إذن إنترنت — كل نداء لـSupabase سيفشل على جهاز المستخدم."
            exit 1
          }

          LABEL=$("$AAPT" dump badging "$APK" | sed -n "s/^application-label:'\(.*\)'/\1/p")
          [ "$LABEL" != "aras" ] || { echo "::error::اسم التطبيق ما زال اسم القالب."; exit 1; }

          # ــــ رقمُ البناء واسمُ النسخة ــــــــــــــــــــــــــــــــــــــ
          #
          # **يُقرآن من الحزمة نفسِها لا من `pubspec.yaml`.** الملفُّ يقول ما
          # طُلب، والحزمةُ تقول ما خرج — وبينهما `flutter.versionCode` وGradle.
          # والذي يقارنه التطبيقُ بجدول `app_versions` هو ما في الحزمة.
          BADGING=$("$AAPT" dump badging "$APK")
          APKCODE=$(echo "$BADGING" | sed -n "s/.*versionCode='\([0-9]*\)'.*/\1/p" | head -1)
          VNAME=$(echo "$BADGING" | sed -n "s/.*versionName='\([^']*\)'.*/\1/p" | head -1)

          # **والرقمُ الذي يُدخَل في `app_versions` هو رقمُ `pubspec` لا رقمُ
          # الحزمة.** و‍`--split-per-abi` يضيف ألفاً لكلّ معماريّة: حزمةُ
          # arm64 خرجت بـ‍`versionCode = 2002` و‍`pubspec` يقول `+2`.
          #
          # والتطبيقُ يقارن بثابت `app_version.dart` — وهو رقمُ `pubspec`
          # بعينه، يحرسه اختبار. فلو أُدخل ٢٠٠٢ لَرأى صاحبُ أحدث حزمةٍ
          # الشريطَ أبداً: ينزّل ثمّ يعود فيجده كما هو.
          #
          # وقد كتبتُ أوّلَ مرّة «تُقرأ من الحزمة لأنّها أصدق»، وهي حجّةٌ
          # خاطئة: الحزمةُ تقول رقماً **لا يقارنه التطبيق**.
          # والمسارُ بلا `mobile/`: هذه الخطوة تعمل في `working-directory:
          # mobile` أصلاً. كتبتُه `mobile/pubspec.yaml` أوّلَ مرّة فصار
          # `mobile/mobile/pubspec.yaml` وسقط البناء.
          BUILD=$(sed -n 's/^version: .*+\([0-9][0-9]*\)$/\1/p' pubspec.yaml | head -1)
          if [ -z "$BUILD" ]; then
            echo "::error::لم أقرأ رقم البناء من mobile/pubspec.yaml"
            exit 1
          fi

          # وحارسٌ على العلاقة بينهما: الإزاحةُ مضاعفاتُ ألف، فالباقي هو
          # رقمُ pubspec. وإن تبدّلت قسمةُ Flutter يوماً سقط هذا وتُراجع.
          if [ "$((APKCODE % 1000))" -ne "$BUILD" ]; then
            echo "::error::رقمُ الحزمة $APKCODE لا يوافق pubspec (+$BUILD) — راجع قسمة versionCode."
            exit 1
          fi

          echo "VCODE=$BUILD" >> "$GITHUB_ENV"
          echo "VNAME=$VNAME" >> "$GITHUB_ENV"
          echo "رقم البناء (pubspec): $BUILD — في الحزمة: $APKCODE — النسخة: $VNAME"

          # وهل حملت الحزمةُ تهيئةَ Firebase فعلاً؟
          #
          # لا يكفي أن يُكتب الملف: إضافة Google Services تُطبَّق بشرطٍ في
          # `build.gradle.kts`، فلو تغيّر مسارٌ أو شرط لخرجت حزمةٌ سليمةُ
          # المظهر لا يصلها إشعارٌ أبداً — ولا سطرَ خطأ في أي سجلّ. والذي
          # يفصل هو الحزمة نفسها: الإضافة تولّد مورد `google_app_id`، فوجودُه
          # دليلٌ على أنها عملت، وغيابُه دليلٌ على أنها لم تعمل.
          PUSH=off
          if "$AAPT" dump resources "$APK" | grep -q 'google_app_id'; then PUSH=on; fi
          if [ "${PUSH_EXPECTED:-0}" = "1" ] && [ "$PUSH" = "off" ]; then
            echo "::error::السرّ مضبوطٌ ومع ذلك خرجت الحزمة بلا تهيئة Firebase — إضافة Google Services لم تُطبَّق."
            exit 1
          fi

          {
            echo "### الحزمة"
            echo "- الاسم تحت الأيقونة: **$LABEL**"
            echo "- إذن الإنترنت: موجود ✅"
            if [ "$PUSH" = "on" ]; then
              echo "- الدفع إلى الجوال: مضبوط ✅ (تصلها إشعاراتٌ وهي مغلقة)"
            else
              echo "- الدفع إلى الجوال: مطفأ ⚠️ (الإشعارات داخل التطبيق وحده)"
            fi
            echo ""
            echo "| الحزمة | الحجم |"
            echo "|---|---|"
            for f in build/app/outputs/flutter-apk/*-release.apk; do
              echo "| \`$(basename "$f")\` | $(du -h "$f" | cut -f1) |"
            done
          } >> "$GITHUB_STEP_SUMMARY"

          # سقفُ الحجم — حارسٌ لا زينة.
          #
          # **الحزمة تسمن بلا أن يلحظ أحد:** حزمةٌ تُضاف، وخطٌّ يُرفق،
          # وإعدادٌ يُطفأ — كلٌّ منها بضعُ مئاتٍ من الكيلوبايتات لا تُرى في
          # مراجعة، حتى يجد صاحبُ جوالٍ بشبكةٍ ضعيفة أنّ عليه أن ينزّل
          # ثلاثين ميجابايت. فيُقاس الرقم هنا ويُقارَن بسقفٍ مكتوب.
          #
          # ورفعُ السقف قرارٌ يُتّخذ ويُكتب في التزام، لا شيءٌ يقع من تلقائه.
          #
          # وتاريخُه: وُضع أوّلَ مرّة ٢١ **تخميناً** فأسقط بناءً سليماً. ثمّ
          # ٢٢ لأنه المقيس بعد R8 — كانت ٢٣٫٧ فصارت ٢٢. والآن ٢٦.
          #
          # **ولماذا ٢٦:** دخلت ثلاثُ مكتباتٍ تحمل شيفرةً أصليّة — خريطةُ
          # `flutter_map`، وقارئُ `pdfx`، ومشغّلُ `video_player` — فصارت
          # الحزمةُ ٢٣ م.ب. وهي ثلاثتُها في خدمةِ شيءٍ واحد: أن يُفتح ما
          # يصل في الدردشة **داخل التطبيق**، وأن يصل المصوّر إلى بيت العرس.
          # فليس فيها ما يُستغنى عنه بلا خسارة.
          #
          # **والسقفُ يُشدّ إلى ما فوق المقيس لا إلى ما نتمنّاه** — وثلاثةٌ
          # فوق الثلاثة والعشرين تسعُ نموّاً معقولاً وتبقى ضيّقةً بما يكفي
          # لتصرخ إن دخلت مكتبةٌ ثقيلةٌ بلا انتباه. وهذا ليس تسليماً: من
          # يريد التنحيف يبدأ من الجدول أدناه، وفيه أين الوزن فعلاً.
          MAX_MB=26
          BYTES=$(stat -c%s "$APK")
          MB=$(( (BYTES + 1048575) / 1048576 ))
          echo "حجم حزمة ARM64: ${MB} م.ب (السقف ${MAX_MB})"

          # وأين تذهب البايتات — من الحزمة نفسها لا من التخمين.
          #
          # **وهذا ما كان ناقصاً حين نُحّفت أوّل مرّة:** خُمِّن أن الوزن في
          # أصناف Java فشُغِّل R8، فوفّر ١٫٧ م.ب من ٢٣٫٧ — أي أن التخمين
          # كان يقيس المكان الخطأ. والجدول أدناه يقول أين الوزن فعلاً، فأيُّ
          # تنحيفٍ قادمٍ يبدأ من رقمٍ لا من ظنّ.
          #
          # **والجدولُ يُطبع قبل الحكم لا بعده.** كان `exit 1` فوقه، فحين
          # تجاوزت الحزمةُ السقفَ — وهو وقتُ الحاجة إليه — لم يُطبع، وبقي من
          # يريد تنحيفَها يخمّن من جديد. وهذا عيبٌ في البوّابة نفسها: بوّابةٌ
          # ترفض ولا تقول أين الخلل تُعلّم صاحبَها أن يرفع السقف بلا نظر.
          {
            echo ""
            echo "<details><summary>أين تذهب البايتات</summary>"
            echo ""
            echo "| داخل الحزمة | الحجم |"
            echo "|---|---|"
            unzip -l "$APK" \
              | awk 'NR>3 && NF>=4 { size=$1; $1=$2=$3=""; sub(/^ +/,""); print size"\t"$0 }' \
              | sort -rn | head -12 \
              | awk -F'\t' '{ printf "| `%s` | %.1f م.ب |\n", $2, $1/1048576 }'
            echo ""
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"

          # والحكمُ بعد أن قيل أين الوزن.
          if [ "$MB" -gt "$MAX_MB" ]; then
            echo "::error::الحزمة ${MB} م.ب وقد تجاوزت السقف ${MAX_MB} م.ب. ارفع السقف عمداً أو أعد التنحيف — والجدول أعلاه يقول من أين تبدأ."
            echo "- حجم ARM64: **${MB} م.ب** — تجاوز السقف ${MAX_MB} ❌" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "- حجم ARM64: **${MB} م.ب** (السقف ${MAX_MB}) ✅" >> "$GITHUB_STEP_SUMMARY"

      # حزمة Actions تنزل ملفَ zip ولا تُفتح إلا بحسابٍ على GitHub — وكلاهما
      # عائقٌ على الجوال. أمّا أصول الإصدار فتُنزَّل بضغطةٍ من المتصفّح بلا
      # حساب ولا فكّ ضغط، وأندرويد يعرض «تثبيت» مباشرةً بعدها.
      - name: نشر الحزمة في الإصدارات
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: build-${{ github.run_number }}
        run: |
          set -euo pipefail
          mkdir -p dist
          # أسماءٌ تقول لمن هي: `app-arm64-v8a-release.apk` لا تعني شيئاً لمن
          # يقف أمام ملفات على جواله. ولاتينيّةٌ عمداً — GitHub يعبث بأسماء
          # الأصول غير اللاتينية، ولا أراهن باسمٍ على طريق التنزيل كلّه.
          #
          # واسمُ كلٍّ في متغيّرٍ واحد يُنسخ إليه ثم يُرفع منه: كتبتُها أوّل مرّة
          # مرتين، فغيّرتُ إحداهما ونسيت الأخرى، فسقط البناء عند الرفع.
          ARM64=dist/farhati-arm64.apk
          ARM32=dist/farhati-arm32.apk
          cp mobile/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk   "$ARM64"
          cp mobile/build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk "$ARM32"

          cat > notes.md <<'NOTES'
          ## التثبيت على الجوال

          افتح هذه الصفحة **من متصفّح جوالك** ونزّل:

          **`farhati-arm64.apk`** — هذا هو المطلوب لكل جوال حديث.

          فإن قال جوالك إن الحزمة غير متوافقة — وهذا نادر ولا يكون إلا في
          أجهزة قديمة جداً — فنزّل `farhati-arm32.apk` بدلاً منه.

          بعد التنزيل يسألك أندرويد عن السماح بالتثبيت من هذا المتصفّح: اسمح،
          ثم اضغط «تثبيت». السؤال طبيعي لأن الحزمة لا تأتي من متجر Play.

          ## ملاحظتان

          - الحزمة موقّعة بمفتاح تطوير: تعمل على جوالك تماماً، ولا تصلح للرفع
            على Google Play. النشر على المتجر يحتاج مفتاح توقيعٍ خاصاً بك.
          - إن لم تكن أسرار `SUPABASE_URL` و`SUPABASE_ANON_KEY` مضبوطةً في
            المستودع، فهذه الحزمة تعمل على **بيانات تجريبية** لا على قاعدتك.
            وملخّص تشغيل البناء يقول أيّهما.
          NOTES

          # حالُ الدفع في الوصف لا في السجلّ: من ينزّل الحزمة ولا يصله إشعارٌ
          # وهو مغلق يظنّ العطب في جواله، والصفحة التي نزّل منها هي أوّل ما
          # يعود إليه.
          if [ "${PUSH_EXPECTED:-0}" != "1" ]; then
            cat >> notes.md <<'OFF'
          - إشعارات الجوال **وهو مغلق** مطفأةٌ في هذه الحزمة (لا `GOOGLE_SERVICES_JSON`
            في أسرار المستودع). والجرس داخل التطبيق يعمل كما هو.
          OFF
          fi

          # إعادة تشغيل بناءٍ فاشل تُبقي الرقم نفسه، فيصطدم الإنشاء بإصدارٍ
          # قائم. الحذف أوّلاً يجعل الخطوة تُعاد بلا أثر.
          gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true

          # `--target` ضروري: بدونه يصنع gh الوسمَ على الفرع الافتراضي، فيشير
          # `build-N` إلى شيفرةٍ غير التي بُنيت منها الحزمة المرفوعة فيه — وهو
          # أسوأ من ألّا يكون هناك وسمٌ أصلاً.
          gh release create "$TAG" \
            --target "$GITHUB_SHA" \
            --title "فرحتي — حزمة $TAG" \
            --notes-file notes.md \
            "$ARM64" "$ARM32"

          # الرابط يُركَّب لا يُستعلَم: شكله ثابت، والاستعلام نداءٌ زائد قد يفشل
          # بعد أن يكون الإصدار قد نُشر فعلاً فيُسقط بناءً ناجحاً.
          {
            echo "### التنزيل على الجوال"
            echo "افتح هذا من متصفّح جوالك:"
            echo ""
            echo "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/$TAG"
            echo ""

            # ــــ سطرُ الإدخال، جاهزاً ــــــــــــــــــــــــــــــــــــــ
            #
            # **ولا يُكتب رقمُ البناء بيد.** هو مقروءٌ من الحزمة التي رُفعت
            # للتوّ، والرابطُ هو رابطُ أصلِها بعينه. ورقمٌ يُنسخ بالعين من
            # سجلٍّ إلى محرّر SQL يُخطأ مرّةً في كلّ عشر — ويُخطئ صامتاً:
            # صفٌّ برقمٍ أقلّ لا يظهر لأحد، وبرقمٍ أكبر يُبقي الشريطَ بعد
            # التنزيل.
            #
            # والأصلُ لا صفحةُ الإصدار: التطبيق يفتح ما في العمود مباشرةً،
            # ورابطُ الصفحة يُنزل صاحبَه على صفحةٍ يبحث فيها عن الملفّ.
            ASSET="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/download/$TAG/$(basename "$ARM64")"
            echo "### أضِف النسخة إلى قاعدتك"
            echo ""
            echo "الصقه في محرّر SQL — أو أدخل الرابط في **اللوحة ← الإصدارات**:"
            echo ""
            echo '```sql'
            echo "insert into public.app_versions"
            echo "  (platform, version, build, download_url, notes)"
            echo "values"
            echo "  ('android', '${VNAME}', ${VCODE},"
            echo "   '${ASSET}',"
            echo "   'وصفٌ قصيرٌ يقرؤه صاحبُ الجوال في الشريط.')"
            echo "on conflict (platform, build) do update"
            echo "  set download_url = excluded.download_url,"
            echo "      version       = excluded.version;"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # لا تُبنى مع كل تشغيل: بناءٌ ثانٍ كامل يضاعف الزمن، ولا يُنشر على Play
      # في كل تجربة. تُبنى عند وسم إصدار، أو عند طلبها في التشغيل اليدوي.
      - name: بناء حزمة النشر على Google Play
        if: startsWith(github.ref, 'refs/tags/') || inputs.appbundle
        working-directory: mobile
        run: flutter build appbundle --release --dart-define-from-file=env.json

      - uses: actions/upload-artifact@v4
        with:
          name: farhati-android
          path: |
            mobile/build/app/outputs/flutter-apk/*.apk
            mobile/build/app/outputs/bundle/release/*.aab
          if-no-files-found: warn
          retention-days: 30
