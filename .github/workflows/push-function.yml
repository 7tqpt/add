name: نشر دوالّ الحافة

# يُشغَّل يدوياً من تبويب Actions، وتلقائياً حين تتغيّر دالّةٌ على main.
#
# **وكان ينشر `push` وحدَها بالاسم.** فلمّا أُضيفت `phone-otp` عمل السيرُ
# ونجح ولم يَنشرها — والملخّصُ يقول «نُشرت» فيُقرأ أنّ الكلَّ نُشر. عيبٌ
# أخطرُ من الفشل: الفشلُ يُرى.
#
# فصارت الدوالُّ تُعدَّد صراحةً، ولكلٍّ حكمُها في التحقّق من الجلسة.
#
# **ولماذا من هنا لا من الحاسوب:** نشرُ الدالّة يحتاج `supabase` CLI مثبّتاً،
# ورمزَ وصولٍ في الطرفية، وأن يتذكّر صاحبُها أن ينشرها بعد كل تعديل. وهذه
# ثلاثةُ أبوابٍ للنسيان. وهنا: تتغيّر الدالّة على main فتُنشَر وحدها.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['supabase/functions/**']

jobs:
  deploy:
    name: نشر الدوالّ
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      # السرّان يُضافان مرّةً في: Settings → Secrets and variables → Actions
      #
      #   SUPABASE_ACCESS_TOKEN  — من supabase.com/dashboard/account/tokens
      #   SUPABASE_PROJECT_REF   — الجزء الأوسط من رابط مشروعك
      #                            (https://‹هذا›.supabase.co)
      #
      # وبلا واحدٍ منهما يقف السير برسالةٍ تقول أيُّهما ناقص، ولا يفشل بصمت.
      - name: التحقّق من الأسرار
        env:
          TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          missing=""
          [ -z "$TOKEN" ] && missing="$missing SUPABASE_ACCESS_TOKEN"
          [ -z "$REF" ] && missing="$missing SUPABASE_PROJECT_REF"
          if [ -n "$missing" ]; then
            echo "::error::ينقص:$missing — أضفه في Settings → Secrets → Actions"
            exit 1
          fi
          echo "✅ السرّان موجودان"

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      # **ولكلِّ دالّةٍ حكمُها في التحقّق من الجلسة — ولا يُوحَّد.**
      #
      # `push`: `--no-verify-jwt` لأنّ المنادي مُشغِّلُ قاعدة البيانات لا
      # مستخدمٌ يحمل جلسة. ولو طُلب التحقّق لرُدَّ كلُّ إشعارٍ بـ401 بلا أن
      # يظهر في سجلّ التطبيق شيء.
      #
      # `phone-otp`: **بالتحقّق** — يناديها مستخدمٌ داخلٌ برمز جلسته، وكلُّ
      # نداءٍ يُنفق من رصيدٍ مدفوع. فالبوّابةُ تردّ من لا جلسةَ له قبل أن
      # تعمل الدالّةُ أصلاً، والدالّةُ تُعرف صاحبَها من الرمز بعدها.
      - name: نشر
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          set -euo pipefail
          supabase functions deploy push --project-ref "$REF" --no-verify-jwt
          supabase functions deploy phone-otp --project-ref "$REF"

      # **ويُسأل الخادمُ عمّا عنده لا يُفترض.** دالّةٌ تُضاف في المستودع ولا
      # يُذكَر اسمُها هنا تمرّ صامتةً — وهو ما وقع بـ`phone-otp`. فتُقارَن
      # مجلّداتُ `supabase/functions` بما نشرناه، ويُسقط السيرُ إن بقي
      # مجلّدٌ لم يُنشَر.
      - name: لا دالّةَ منسيّة
        run: |
          set -euo pipefail
          deployed="push phone-otp"
          missing=""
          for dir in supabase/functions/*/; do
            name=$(basename "$dir")
            case " $deployed " in
              *" $name "*) ;;
              *) missing="$missing $name" ;;
            esac
          done
          if [ -n "$missing" ]; then
            echo "::error::دوالٌّ في المستودع ولم تُنشَر:$missing — أضِف سطرَ نشرٍ لها في .github/workflows/push-function.yml"
            exit 1
          fi
          echo "✅ كلُّ دالّةٍ في المستودع لها سطرُ نشر"

      - name: الخلاصة
        run: |
          {
            echo "### نُشرت دالّتان: \`push\` و\`phone-otp\`"
            echo ""
            echo "**الإشعارات** — بقي شيئان في محرّر SQL:"
            echo ""
            echo '1. `supabase/notifications.sql` — إن لم يكن شُغّل بعد.'
            echo '2. `supabase/push_hook.sql` ثم:'
            echo '   ```sql'
            echo "   select public.enable_push_webhook('https://${{ secrets.SUPABASE_PROJECT_REF }}.supabase.co');"
            echo '   ```'
            echo ""
            echo 'وسرُّ `FCM_SERVICE_ACCOUNT` في Edge Functions → Secrets.'
            echo ""
            echo "**تحقّقُ الرقم** — يحتاج `supabase/phone_verify.sql` في محرّر SQL،"
            echo 'وسرَّي `AUTHENTICA_API_KEY` و`AUTHENTICA_TEMPLATE_ID` في الأسرار.'
          } >> "$GITHUB_STEP_SUMMARY"
