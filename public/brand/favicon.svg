<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="سد للبرمجيات">
  <!--
    أيقونة المتصفّح — مبسّطةٌ عن الشعار الكامل عمداً.

    الشعار الكامل حلقةٌ تقنيةٌ وثلاثة أحرفٍ مجسّمة، وكلّها تتحوّل إلى لطخةٍ
    زرقاء عند ستة عشر بكسلاً — وهو المقاس الذي تُرى فيه الأيقونة فعلاً. فبقي
    منها ما يُقرأ في ذلك المقاس: الحرف الأول بزاويّته، وزرقة العلامة، وأرضيتها
    الداكنة. والتبسيط هنا وفاءٌ للهوية لا تفريطٌ فيها.
  -->
  <defs>
    <linearGradient id="sdd-blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7fc4ff"/>
      <stop offset="0.5" stop-color="#2f80ff"/>
      <stop offset="1" stop-color="#1436a8"/>
    </linearGradient>
  </defs>

  <rect width="64" height="64" rx="14" fill="#070c16"/>
  <rect x="1.5" y="1.5" width="61" height="61" rx="12.5" fill="none"
        stroke="#1d4ed8" stroke-opacity="0.55" stroke-width="1.5"/>

  <!-- حرف S زاويّ لا منحنٍ، كما في الشعار -->
  <polyline points="45,17 20,17 20,30 44,30 44,47 19,47"
            fill="none" stroke="url(#sdd-blue)" stroke-width="7.5"
            stroke-linecap="square" stroke-linejoin="miter"/>
</svg>
