<div dir="rtl" lang="ar" style="margin:0;padding:24px 12px;background:#FBF4EF;font-family:'Segoe UI',Tahoma,Arial,sans-serif;">
  <div style="max-width:480px;margin:0 auto;background:#FFFFFF;border-radius:16px;overflow:hidden;border:1px solid #F0E4DC;">

    <div style="background:#7B0F2E;padding:28px 24px;text-align:center;">

    <div style="padding:28px 24px;">

      <p style="margin:0;font-size:13px;line-height:1.9;color:#8A7580;">

      </p>

    <div style="background:#FBF4EF;padding:16px 24px;text-align:center;font-size:12px;color:#8A7580;border-top:1px solid #F0E4DC;">
