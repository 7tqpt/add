<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="لوحة تحكم منصة حجوزات وتجهيز الأعراس — الحجوزات، مقدّمو الخدمة، المدفوعات والنزاعات. من سد للبرمجيات." />
    <title>سد للبرمجيات — لوحة إدارة المنصّة</title>

    <!--
      شعار التبويب. لاستبداله بملفّ العلامة الأصلي: ضع الصورة في
      `public/brand/logo.png` وبدّل السطر التالي بـ
      <link rel="icon" type="image/png" href="/brand/logo.png" />
      ويُفضّل أن تكون 512×512 بخلفيةٍ داكنة، لأن التبويب يعرضها 16 بكسلاً.
    -->
    <link rel="icon" type="image/svg+xml" href="/brand/favicon.svg" />
    <link rel="apple-touch-icon" href="/brand/favicon.svg" />

    <!-- لون شريط المتصفّح على الجوال — يتبع الثيم فلا ينشزّ عن الصفحة -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f4f7fc" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#070c16" />
    <script>
      // Apply the stored theme before first paint so the page never flashes light-then-dark.
      try {
        var t = localStorage.getItem('theme')
        if (t === 'dark' || t === 'light') document.documentElement.setAttribute('data-theme', t)
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
