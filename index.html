<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="لوحة تحكم لإدارة تطبيق الجوال — المستخدمون، الإشعارات، الإصدارات والإحصائيات." />
    <title>لوحة التحكم — تطبيق الجوال</title>
    <script>
      // Apply the stored theme before first paint so the page never flashes light-then-dark.
      try {
        var t = localStorage.getItem('theme')
        if (t === 'dark' || t === 'light') document.documentElement.setAttribute('data-theme', t)
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
