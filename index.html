<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="لوحة تحكم منصة حجوزات وتجهيز الأعراس — الحجوزات، مقدّمو الخدمة، المدفوعات والنزاعات. من سد للبرمجيات." />
    <title>سد للبرمجيات — لوحة إدارة المنصّة</title>

    <!--
      شعار التبويب هو العلامة نفسها، مقصوصةً في قرصٍ شفّاف الحواف.

      ونسختان لا واحدة: التبويب يعرضها 16 بكسلاً، وتصغيرُ ملفٍّ 512 إلى 16
      يذيب تفاصيلها في الطريق. فالنسخة الصغيرة تُصغَّر مرّةً واحدة عندنا
      بخوارزميةٍ أدقّ، والكبيرة تبقى لشاشة الجوال حين تُضاف إلى الشاشة.
    -->
    <link rel="icon" type="image/png" sizes="64x64" href="/brand/favicon.png" />
    <link rel="apple-touch-icon" href="/brand/logo.png" />

    <!-- لون شريط المتصفّح على الجوال — يتبع الثيم فلا ينشزّ عن الصفحة -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f4f7fc" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#070c16" />
    <script>
      // Apply the stored theme before first paint so the page never flashes light-then-dark.
      try {
        var t = localStorage.getItem('theme')
        if (t === 'dark' || t === 'light') document.documentElement.setAttribute('data-theme', t)
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
