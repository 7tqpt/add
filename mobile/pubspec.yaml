name: aras
description: "فرحتي — تطبيق حجز خدمات الأعراس وتجهيزها في اليمن."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
# **يُرفع رقمُ البناء (ما بعد `+`) مع كلّ حزمةٍ تُنشر.**
#
# وهو المقارَنُ في `app_versions.build`: من ثبّت حزمةً تقول «١» ثمّ نزّل
# حزمةً تقول «١» كذلك يبقى شريطُ «صدرت نسخةٌ أحدث» أمامه إلى الأبد — نزّل
# ولم يتغيّر عنده شيء.
#
# وقد بقي `1.0.0+1` من أوّل دفعةٍ للتطبيق حتى ٥٧ حزمةً بُنيت كلُّها تقول
# «أنا الأولى». ويحرسه `app_update_test.dart`: يقرأ هذا السطر ويقارنه
# بثابتَي `app_version.dart`.
version: 1.0.9+10

environment:
  sdk: ^3.13.0

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # (حُذفت `cupertino_icons`: لا صنف `CupertinoIcons` في الشيفرة كلِّها،
  # و`GlobalCupertinoLocalizations` تأتي من `flutter_localizations` لا منها.)
  supabase_flutter: ^2.17.1
  intl: ^0.20.3
  image_picker: ^1.2.3
  video_player: ^2.14.0
  file_picker: ^12.0.0
  firebase_core: ^4.13.0
  firebase_messaging: ^16.5.0
  # لقياس فرق الساعة بين الجهاز والخادم من ترويسة `Date` — وهو ما يحوّل
  # «فرقٌ في الساعة» من تخمينٍ إلى رقمٍ يُقال لصاحب الجهاز.
  http: ^1.6.0
  # لقراءة ترويسة `Date` بصيغتها المعيارية.
  http_parser: ^4.1.2
  # التسجيل الصوتي في المحادثة.
  #
  # **وحزمةٌ أصليّةٌ رابعة تُضاف بحذر:** `file_picker` الحادية عشرة كسرت بناء
  # أندرويد كلَّه لأنها تثبّت Kotlin أقدم. وهذه في إصدارها السابع مبنيّةٌ على
  # Gradle حديث — والذي يفصل هو بناءُ CI لا هذا التعليق.
  record: ^7.1.1
  # لقراءة بايتات المقطع بلا `dart:io` — استيرادُها يكسر بناء الويب.
  cross_file: ^0.3.5+5
  # لمجلّد التطبيق المؤقّت، وهو مكانُ ملفّ التسجيل.
  #
  # **وليست ترفاً:** `record` تكتب في المسار الذي يُعطى لها كما هو، والمسارُ
  # النسبيّ يُحسب في أندرويد من `/` — لا يُكتب فيه. فكان التسجيل يبدأ ثم يموت
  # صامتاً. وهذه من حزم Flutter نفسها، ولا تجرّ Kotlin أقدم.
  path_provider: ^2.1.5
  # لفتح ملفّ المحادثة (PDF) في قارئ الجهاز.
  #
  # **ولا حزمةَ أصليّةٍ جديدة هنا:** `supabase_flutter` تجرّها أصلاً لمسار
  # الدخول بحسابات الغير — فذكرُها هنا يجعل الاعتماد صريحاً لا يزيد شيئاً
  # في الحزمة.
  url_launcher: ^6.3.2
  # ورقةُ المشاركة التي يفتحها النظام — واتساب وغيرُه.
  share_plus: ^13.3.0
  # الخريطة — **دارتٌ خالصةٌ لا شيفرةَ أصليّةَ فيها**، فلا تجرّ Kotlin أقدم
  # ولا تكسر بناء أندرويد كما فعلت `file_picker` الحادية عشرة. وبلاطاتُها من
  # OpenStreetMap بلا مفتاحٍ ولا فوترة — انظر رأس `screens/map_picker.dart`.
  flutter_map: ^8.3.1
  # نوعُ الإحداثيّة الذي تطلبه `flutter_map` في واجهتها؛ تجرّها هي أصلاً،
  # وذِكرُها هنا يجعل الاستيرادَ صريحاً ولا يزيد شيئاً في الحزمة.
  latlong2: ^0.10.1
  pdfx: ^2.11.0
  # زرُّ «موقعي الحالي» في منتقي الخريطة.
  #
  # **وهي المرّةُ الوحيدة التي يُطلب فيها موقعُ الجهاز في التطبيق كلِّه**، ولا
  # يُطلب إلّا بضغطةٍ صريحةٍ من صاحبه وهو واقفٌ في المكان. أمّا ترتيبُ البحث
  # بـ«الأقرب إليّ» فمن العنوان المحفوظ لا من الجهاز — راجع `nearby.sql`.
  #
  # ويستلزم إذناً في بيان أندرويد وسطرين في `Info.plist`، وسطراً في سياسة
  # الخصوصيّة يسأل عنه Google Play صراحةً. وكلُّها مكتوبةٌ ومربوطة.
  geolocator: ^14.0.3
  # فتحُ شاشة إعدادات الإشعار في الجهاز من داخل التطبيق.
  #
  # **ولماذا لا يُختار الصوتُ داخل التطبيق:** أندرويد يثبّت نغمةَ القناة عند
  # إنشائها، ولا تتغيّر بعدها من الشيفرة — الطريقُ الوحيد أن تُنشأ قناةٌ ثانية.
  # وجوجل نفسها توصي بألّا تُكرَّر إعداداتُ القناة في التطبيق، بل يُساق صاحبُه
  # إلى شاشة النظام حيث يختار النغمة والاهتزاز والأولويّة معاً.
  #
  # وهي قناةُ أسلوبٍ (method channel) صغيرة، لا شيفرةَ ثقيلةَ فيها.
  app_settings: ^9.0.0
  shared_preferences: ^2.5.5
  # خزنةُ النظام لبصمة رمز القفل — Keychain وKeystore.
  #
  # **و‍١٠٫٣٫١ مثبَّتةٌ لا ١١، والسببُ مقيسٌ من بناءٍ سقط.** ١١٫٠٫٠ تشترط
  # `compileSdk 37`، والمشروع على ٣٦، وAGP ٩٫١٫٠ أقصى ما يوصي به ٣٦ — فرفعُ
  # المشروع كلِّه لأجل حزمةٍ واحدة يجرّ ترقية AGP ومعها كلُّ حزمةٍ أصليّةٍ
  # فيه. و١٠٫٣٫١ تشترط ٣٦ بالضبط، وواجهتُها هي هي.
  flutter_secure_storage: ^10.3.1
  crypto: ^3.0.7
dev_dependencies:
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:
  uses-material-design: true

  # خطّ عربي مرفق بالتطبيق لا مُعتمَد على الجهاز.
  #
  # أندرويد يترك الخطّ العربي لصانع الجهاز، فيختلف بين سامسونج وشاومي والأجهزة
  # الرخيصة، وبعضها يعرض نسخاً رديئاً أو لا يعرض شيئاً. وعلى الويب يُنزَّل من
  # شبكة Google فيغيب النصّ كلّه حيث تُحجب. الإرفاق يجعل الشكل واحداً في كل
  # جهاز. الخطّ Noto Naskh Arabic برخصة SIL OFL 1.1.
  fonts:
    # خطُّ العلامة — أربعةُ أوزان لأن نصفَ التصميم وزنٌ لا لون. ورخصته
    # SIL OFL 1.1، ونصُّها في assets/fonts/IBMPlexSansArabic-OFL.txt.
    - family: IBMPlexSansArabic
      fonts:
        - asset: assets/fonts/IBMPlexSansArabic-400.ttf
        - asset: assets/fonts/IBMPlexSansArabic-500.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexSansArabic-600.ttf
          weight: 600
        - asset: assets/fonts/IBMPlexSansArabic-700.ttf
          weight: 700
    - family: NotoNaskhArabic
      fonts:
        - asset: assets/fonts/NotoNaskhArabic-Regular.ttf
    # **وRoboto حُذف:** كان هنا لأن نوتو نسخ عربيٌّ خالص لا يحمل الأقواس
    # ولا النسبة ولا الشرطة، فبلا خطٍّ لاتيني معه تصير «(87)» و«30%»
    # مربّعاتٍ فارغة. أمّا Plex فيحمل اللاتينية والعربية معاً — قِيس، لا
    # فُرض: `brand_test` يفتح الملفّ ويسأله عن كل محرفٍ تعرضه الشاشات.
    # وبقاؤه بعد Plex ٣٣٦ ك.ب تُشحن ولا تُرسم.

  # To add assets to your application, add an assets section, like this:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package
